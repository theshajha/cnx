<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Big floppy left ear -->
  <ellipse cx="22" cy="38" rx="18" ry="22" fill="#8B7355"/>
  <ellipse cx="24" cy="38" rx="13" ry="17" fill="#C4A882"/>

  <!-- Big floppy right ear -->
  <ellipse cx="78" cy="38" rx="18" ry="22" fill="#8B7355"/>
  <ellipse cx="76" cy="38" rx="13" ry="17" fill="#C4A882"/>

  <!-- Round chunky body -->
  <ellipse cx="50" cy="68" rx="24" ry="20" fill="#9B8365"/>

  <!-- Big round head (elephant signature) -->
  <circle cx="50" cy="40" r="26" fill="#9B8365"/>

  <!-- Forehead bump -->
  <ellipse cx="50" cy="26" rx="14" ry="8" fill="#A08B6D"/>

  <!-- Eyes — big and friendly -->
  <circle cx="40" cy="36" r="5" fill="#FBF7F0"/>
  <circle cx="60" cy="36" r="5" fill="#FBF7F0"/>
  <circle cx="41" cy="37" r="3" fill="#3D2B1F"/>
  <circle cx="61" cy="37" r="3" fill="#3D2B1F"/>
  <circle cx="42" cy="35.5" r="1.2" fill="white"/>
  <circle cx="62" cy="35.5" r="1.2" fill="white"/>

  <!-- Trunk — thick, curling down and to the left toward coffee -->
  <path d="M50 48 C50 54, 48 60, 42 64 C36 68, 28 66, 24 60" stroke="#9B8365" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Trunk tip (lighter) -->
  <circle cx="23" cy="59" r="4.5" fill="#A08B6D"/>

  <!-- Blush cheeks -->
  <circle cx="34" cy="46" r="4" fill="#C4703F" opacity="0.25"/>
  <circle cx="66" cy="46" r="4" fill="#C4703F" opacity="0.25"/>

  <!-- Little smile -->
  <path d="M55 48 Q58 52 64 49" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Front legs — short and stubby -->
  <rect x="36" y="82" width="10" height="12" rx="5" fill="#8B7355"/>
  <rect x="54" y="82" width="10" height="12" rx="5" fill="#8B7355"/>

  <!-- Little feet highlights -->
  <ellipse cx="41" cy="93" rx="5" ry="2" fill="#7A6548"/>
  <ellipse cx="59" cy="93" rx="5" ry="2" fill="#7A6548"/>

  <!-- Tiny tail -->
  <path d="M74 68 Q82 62 80 54" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="80" cy="53" r="2" fill="#8B7355"/>

  <!-- Coffee cup (held by trunk end) -->
  <rect x="10" y="52" width="16" height="14" rx="3" fill="#FBF7F0" stroke="#C4703F" stroke-width="2"/>
  <!-- Handle -->
  <path d="M26 56 Q30 56 30 60 Q30 64 26 64" stroke="#C4703F" stroke-width="2" fill="none"/>
  <!-- Coffee liquid -->
  <rect x="12" y="55" width="12" height="5" rx="1.5" fill="#5C4033"/>
  <!-- Steam curls -->
  <path d="M15 50 Q16 46 15 42" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M21 50 Q22 45 21 40" stroke="#C4A882" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
