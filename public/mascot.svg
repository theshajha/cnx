<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Baby elephant body -->
  <ellipse cx="58" cy="72" rx="28" ry="24" fill="#8B7355"/>

  <!-- Head -->
  <circle cx="58" cy="44" r="22" fill="#9B8365"/>

  <!-- Ears -->
  <ellipse cx="34" cy="40" rx="14" ry="16" fill="#8B7355"/>
  <ellipse cx="34" cy="40" rx="10" ry="12" fill="#C4A882"/>
  <ellipse cx="82" cy="40" rx="14" ry="16" fill="#8B7355"/>
  <ellipse cx="82" cy="40" rx="10" ry="12" fill="#C4A882"/>

  <!-- Eyes -->
  <circle cx="48" cy="40" r="4" fill="#3D2B1F"/>
  <circle cx="68" cy="40" r="4" fill="#3D2B1F"/>
  <circle cx="49.5" cy="38.5" r="1.5" fill="white"/>
  <circle cx="69.5" cy="38.5" r="1.5" fill="white"/>

  <!-- Trunk curling to hold coffee -->
  <path d="M58 52 Q58 62 52 68 Q46 74 40 72 Q36 70 34 66" stroke="#8B7355" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Blush cheeks -->
  <circle cx="44" cy="48" r="4" fill="#C4703F" opacity="0.3"/>
  <circle cx="72" cy="48" r="4" fill="#C4703F" opacity="0.3"/>

  <!-- Smile -->
  <path d="M50 50 Q58 56 66 50" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Legs -->
  <rect x="40" y="88" width="10" height="14" rx="5" fill="#7A6548"/>
  <rect x="62" y="88" width="10" height="14" rx="5" fill="#7A6548"/>

  <!-- Tail -->
  <path d="M86 70 Q94 64 92 56" stroke="#8B7355" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="54" r="2.5" fill="#8B7355"/>

  <!-- Coffee cup held by trunk -->
  <rect x="24" y="58" width="14" height="12" rx="2" fill="#FBF7F0" stroke="#C4703F" stroke-width="1.5"/>
  <!-- Cup handle -->
  <path d="M38 62 Q42 62 42 66 Q42 70 38 70" stroke="#C4703F" stroke-width="1.5" fill="none"/>
  <!-- Coffee inside -->
  <rect x="25.5" y="60" width="11" height="4" rx="1" fill="#5C4033"/>
  <!-- Steam -->
  <path d="M28 56 Q29 52 28 48" stroke="#C4A882" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M33 56 Q34 51 33 47" stroke="#C4A882" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
